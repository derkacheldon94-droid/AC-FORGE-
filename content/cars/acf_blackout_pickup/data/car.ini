; 1994 Chevrolet Silverado Z71 - bed-mounted twin turbo (AC Forge build) - car.ini
; Physics origin = centre of gravity (CG). The 3D model's origin is the ground point
; midway between the axles, so GRAPHICS_OFFSET moves the model down by the CG height
; (0.53 m) and back by the CG's distance ahead of mid-wheelbase (0.149 m).
[HEADER]
VERSION=2

[INFO]
SCREEN_NAME=Chevrolet Silverado Z71 1994 Twin Turbo
SHORT_NAME=Z71TT

[BASIC]
GRAPHICS_OFFSET=0,-0.53,-0.149
GRAPHICS_PITCH_ROTATION=0
TOTALMASS=1580                  ; kg incl. 75 kg driver (stripped truck, iron V8, fuel cell)
INERTIA=2.05,1.45,5.15

[GRAPHICS]
DRIVEREYES=-0.42,1.15,-0.10          ; kn5 frame: left seat is -X, eye height 1.15 m above the ground
ONBOARD_EXPOSURE=34
OUTBOARD_EXPOSURE=34
ON_BOARD_PITCH_ANGLE=-2
MIRROR_POSITION=0,1.44,0.46
VIRTUAL_MIRROR_ENABLED=1
SHAKE_MUL=0.6
USE_ANIMATED_SUSPENSIONS=0
BUMPER_CAMERA_POS=0,0.45,2.50
BUMPER_CAMERA_PITCH=0
BONNET_CAMERA_POS=0,1.20,1.45         ; no hood on this build: camera sits over the engine
BONNET_CAMERA_PITCH=-2

[CONTROLS]
FFMULT=2.2
STEER_ASSIST=1
STEER_LOCK=480
STEER_RATIO=12.5
LINEAR_STEER_ROD_RATIO=0.0035

[FUEL]
CONSUMPTION=0.0062
FUEL=40
MAX_FUEL=80

[FUELTANK]
POSITION=0,0.21,-2.37           ; the aluminium fuel cell at the back of the bed

[RIDE]
PICKUP_FRONT_HEIGHT=0.18
PICKUP_REAR_HEIGHT=0.18

[RULES]
MIN_HEIGHT=0.04

[PIT_STOP]
TYRE_CHANGE_TIME_SEC=10
FUEL_LITER_TIME_SEC=0.5
BODY_REPAIR_TIME_SEC=1
ENGINE_REPAIR_TIME_SEC=2
SUSP_REPAIR_TIME_SEC=2
